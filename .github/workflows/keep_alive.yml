name: Keep Solar Arrays Streamlit App Awake

on:
  schedule:
    # Run every 4 hours
    - cron: '17 */4 * * *'

  # Allow manual execution
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser automation
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit Streamlit App
        env:
          APP_URL: https://solarraysenergy.streamlit.app/
        run: |
          python - <<'PY'
          import os
          import re
          from playwright.sync_api import (
              sync_playwright,
              TimeoutError as BrowserTimeout
          )

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              page.goto(
                  os.environ["APP_URL"],
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              print("Opened:", page.url)

              if "share.streamlit.io/-/auth/" in page.url:
                  raise RuntimeError("App requires authentication")

              wake_button = page.get_by_role(
                  "button",
                  name=re.compile("get this app back up", re.I)
              )

              try:
                  wake_button.wait_for(
                      state="visible",
                      timeout=8000
                  )
                  wake_button.click()
                  print("Wake-up button clicked")
              except BrowserTimeout:
                  print("No wake-up button visible")

              page.locator(
                  '[data-testid="stApp"]'
              ).wait_for(
                  state="visible",
                  timeout=90000
              )

              page.wait_for_timeout(10000)
              print("App visited successfully")
              browser.close()
          PY
